<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ENSABM Exam Paper Editor</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        color: #000;
        background: #eee;
      }
      .app {
        max-width: 1400px;
        margin: 0 auto;
        padding: 12px;
      }
      h1, h2, h3, p { margin: 0 0 10px; }
      .top-layout {
        display: grid;
        grid-template-columns: minmax(360px, 1fr) minmax(360px, 1fr);
        gap: 12px;
        align-items: start;
      }
      .panel {
        background: #fff;
        padding: 12px;
      }
      .preview-panel { grid-column: 1; }
      .controls-panel { grid-column: 2; }
      .table-panel {
        margin-top: 12px;
        background: #fff;
        padding: 12px;
      }
      .control-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px 12px;
        margin-bottom: 16px;
      }
      label { display: block; font-weight: 700; margin-bottom: 4px; }
      input[type="number"] { width: 100%; padding: 6px; }
      button { padding: 7px 10px; margin: 0 4px 8px 0; cursor: pointer; }
      .a4-page {
        position: relative;
        width: 210mm;
        height: 297mm;
        background: #fff;
        overflow: hidden;
        margin: 0 auto 12px;
      }
      .screen-page {
        transform: scale(0.45);
        transform-origin: top left;
        margin-right: calc(210mm * -0.55);
        margin-bottom: calc(297mm * -0.55 + 12px);
      }
      .page-wrap {
        width: calc(210mm * 0.45);
        min-height: calc(297mm * 0.45);
        margin: 0 auto 16px;
        border: 3px solid #ccc; /* Adds border around the preview container */
      }
      .print-image, .seat-number {
        position: absolute;
        display: block;
        
      }
      .print-image { object-fit: contain; }
      .seat-number {
        font-weight: 700;
        line-height: 1;
        white-space: nowrap;
      }
      .page-label { margin: 0 0 6px; font-weight: 700; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 6px; text-align: left; border-bottom: 1px solid #ccc; }
      td input { max-width: 160px; }
      .hint { font-size: 13px; }
      @media (max-width: 900px) {
        .top-layout { grid-template-columns: 1fr; }
        .preview-panel, .controls-panel { grid-column: auto; }
      }
      @page { size: A4; margin: 0; }
      @media print {
        body { background: #fff; margin: 0; }
        .no-print { display: none !important; }
        .app { max-width: none; padding: 0; margin: 0; }
        .top-layout, .preview-panel, .print-pages { display: block; border: 1px solid #000000; }
        .preview-panel { padding: 0; background: #fff; }
        .page-wrap { width: auto; min-height: 0; margin: 0; }
        .page-label { display: none; }
        .a4-page {
          width: 210mm;
          height: 297mm;
          margin: 0;
          break-after: page;
          page-break-after: always;
          border: 2px solid #000000;
        }
        .a4-page:last-child { break-after: auto; page-break-after: auto; }
        .screen-page { transform: none; margin: 0; border: 2px solid #000000;}
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="no-print">
        <h1>ENSABM Exam Paper Editor</h1>
        <p class="hint">Position the logo, cachet, and Desk / Seat number, then print the generated A4 pages.</p>
      </header>

      <section class="top-layout">
        <section class="panel preview-panel">
          <h2 class="no-print">Preview</h2>
          <div class="no-print">
            <button id="printAllBtn" type="button">Print All</button>
            <button id="printOddBtn" type="button">Print Odd Pages</button>
            <button id="printEvenBtn" type="button">Print Even Pages</button>
            <p id="printModeText" class="hint">Current print mode: All pages</p>
          </div>
          <div id="printPages" class="print-pages"></div>
        </section>

        <section class="panel controls-panel no-print">
          <h2>Draft Layout</h2>

          <h3>ENSABM Logo</h3>
          <div class="control-grid">
            <div><label for="logoX">X position (mm)</label><input id="logoX" type="number" step="1" value="5" /></div>
            <div><label for="logoY">Y position (mm)</label><input id="logoY" type="number" step="1" value="6" /></div>
            <div><label for="logoW">Width (mm)</label><input id="logoW" type="number" step="1" min="1" value="78" /></div>
            <div><label for="logoH">Height (mm)</label><input id="logoH" type="number" step="1" min="1" value="26" /></div>
          </div>

          <h3>Desk / Seat Number</h3>
          <div class="control-grid">
            <div><label for="seatX">X position (mm)</label><input id="seatX" type="number" step="1" value="107" /></div>
            <div><label for="seatY">Y position (mm)</label><input id="seatY" type="number" step="1" value="5" /></div>
            <div><label for="seatSize">Font size (pt)</label><input id="seatSize" type="number" step="1" min="1" value="81" /></div>
          </div>

          <h3>Cachet</h3>
          <div class="control-grid">
            <div><label for="cachetX">X position (mm)</label><input id="cachetX" type="number" step="1" value="36" /></div>
            <div><label for="cachetY">Y position (mm)</label><input id="cachetY" type="number" step="1" value="265" /></div>
            <div><label for="cachetW">Width (mm)</label><input id="cachetW" type="number" step="1" min="1" value="49" /></div>
            <div><label for="cachetH">Height (mm)</label><input id="cachetH" type="number" step="1" min="1" value="36" /></div>
          </div>

          <button id="resetBtn" type="button">Reset layout</button>
        </section>
      </section>

      <section class="table-panel no-print">
        <h2>Student Digitization Table</h2>
        <div>
          <button id="addRowBtn" type="button">Add row</button>
          <button id="generateBtn" type="button">Generate sequential numbers automatically</button>
          <button id="clearBtn" type="button">Clear rows</button>
        </div>
        <table>
          <thead>
            <tr><th>Desk / Seat</th><th>Action</th></tr>
          </thead>
          <tbody id="seatRows"></tbody>
        </table>
      </section>
    </main>

    <script>
      (() => {
        // Application state kept small: only printable elements and Desk / Seat rows.
        const state = {
          printMode: "all",
          layout: {
            logo: { x: 5, y: 6, w: 78, h: 26 },
            seat: { x: 107, y: 5, size: 81 },
            cachet: { x: 162, y: 265, w: 49, h: 36 }
          },
          seats: ["0001"]
        };

        const imagePaths = {
          logo: "images/logo.png",
          cachet: "images/cache.png"
        };

        const controls = {
          logoX: document.getElementById("logoX"),
          logoY: document.getElementById("logoY"),
          logoW: document.getElementById("logoW"),
          logoH: document.getElementById("logoH"),
          cachetX: document.getElementById("cachetX"),
          cachetY: document.getElementById("cachetY"),
          cachetW: document.getElementById("cachetW"),
          cachetH: document.getElementById("cachetH"),
          seatX: document.getElementById("seatX"),
          seatY: document.getElementById("seatY"),
          seatSize: document.getElementById("seatSize")
        };

        const printPages = document.getElementById("printPages");
        const seatRows = document.getElementById("seatRows");
        const printModeText = document.getElementById("printModeText");

        // Converts a seat value to the required printable #01# format.
        function formatSeat(value) {
          const clean = String(value || "").replace(/\D/g, "");
          return `#${(clean || "0").padStart(2, "0")}#`;
        }

        // Keeps editable values safe when injecting table HTML.
        function escapeHtml(value) {
          return String(value).replace(/[&<>'"]/g, (char) => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
          }[char]));
        }

        // Returns the page numbers that should be visible and printed.
        function printableSeats() {
          return state.seats.filter((seat, index) => {
            const pageNumber = index + 1;
            if (state.printMode === "odd") return pageNumber % 2 === 1;
            if (state.printMode === "even") return pageNumber % 2 === 0;
            return true;
          });
        }

        // Builds a single A4 page so preview and print output share the exact markup.
        function pageTemplate(seat, pageNumber) {
          const { logo, cachet } = state.layout;
          const seatLayout = state.layout.seat;
          return `
            <div class="page-wrap">
              
              <section class="a4-page screen-page">
                <img class="print-image" src="${imagePaths.logo}" alt="ENSABM logo" loading="eager" decoding="sync" style="left:${logo.x}mm;top:${logo.y}mm;width:${logo.w}mm;height:${logo.h}mm;" />
                <img class="print-image" src="${imagePaths.cachet}" alt="Official cachet" loading="eager" decoding="sync" style="left:${cachet.x}mm;top:${cachet.y}mm;width:${cachet.w}mm;height:${cachet.h}mm;" />
                <div class="seat-number" style="left:${seatLayout.x}mm;top:${seatLayout.y}mm;font-size:${seatLayout.size}pt;">${formatSeat(seat)}</div>
              </section>
            </div>
          `;
        }

        // Re-renders all live A4 preview pages after any control or table change.
        function renderPreview() {
          const seats = printableSeats();
          printPages.innerHTML = seats.length
            ? seats.map((seat, index) => pageTemplate(seat, index + 1)).join("")
            : '<p class="hint no-print">No Desk / Seat rows available for this print mode.</p>';
          printModeText.textContent = `Current print mode: ${state.printMode === "all" ? "All pages" : state.printMode === "odd" ? "Odd pages" : "Even pages"}`;
        }

        // Re-renders the editable one-column digitization table.
        function renderTable() {
          seatRows.innerHTML = state.seats.map((seat, index) => `
            <tr>
              <td><input type="number" min="1" step="1" value="${escapeHtml(seat)}" data-index="${index}" aria-label="Desk / Seat ${index + 1}" /></td>
              <td><button type="button" data-delete="${index}">Delete row</button></td>
            </tr>
          `).join("");
          renderPreview();
        }

        // Reads numeric control values into layout state.
        function readLayoutControls() {
          state.layout.logo = { x: +controls.logoX.value, y: +controls.logoY.value, w: +controls.logoW.value, h: +controls.logoH.value };
          state.layout.cachet = { x: +controls.cachetX.value, y: +controls.cachetY.value, w: +controls.cachetW.value, h: +controls.cachetH.value };
          state.layout.seat = { x: +controls.seatX.value, y: +controls.seatY.value, size: +controls.seatSize.value };
          renderPreview();
        }

        // Writes default layout values back to controls and preview.
        function resetLayout() {
          Object.assign(state.layout, {
            logo: { x: 5, y: 6, w: 78, h: 26 },
            seat: { x: 107, y: 5, size: 81 },
            cachet: { x: 162, y: 265, w: 49, h: 36 }
          });
          controls.logoX.value = state.layout.logo.x; controls.logoY.value = state.layout.logo.y;
          controls.logoW.value = state.layout.logo.w; controls.logoH.value = state.layout.logo.h;
          controls.cachetX.value = state.layout.cachet.x; controls.cachetY.value = state.layout.cachet.y;
          controls.cachetW.value = state.layout.cachet.w; controls.cachetH.value = state.layout.cachet.h;
          controls.seatX.value = state.layout.seat.x; controls.seatY.value = state.layout.seat.y; controls.seatSize.value = state.layout.seat.size;
          renderPreview();
        }

        // Waits for all printable images to finish loading before opening the print dialog.
        // This prevents browsers from printing a broken image box when a freshly rendered
        // cachet image is still being fetched or decoded.
        function waitForPrintableImages() {
          const images = Array.from(printPages.querySelectorAll("img.print-image"));
          return Promise.all(images.map((image) => {
            if (image.complete && image.naturalWidth > 0) return Promise.resolve();
            return new Promise((resolve) => {
              image.addEventListener("load", resolve, { once: true });
              image.addEventListener("error", resolve, { once: true });
            });
          }));
        }

        // Sets the print mode and uses native browser printing.
        async function printWithMode(mode) {
          state.printMode = mode;
          renderPreview();
          await waitForPrintableImages();
          window.print();
        }

        // Binds all user interactions once at startup.
        function bindEvents() {
          Object.values(controls).forEach((input) => input.addEventListener("input", readLayoutControls));
          document.getElementById("resetBtn").addEventListener("click", resetLayout);
          document.getElementById("printAllBtn").addEventListener("click", () => printWithMode("all"));
          document.getElementById("printOddBtn").addEventListener("click", () => printWithMode("odd"));
          document.getElementById("printEvenBtn").addEventListener("click", () => printWithMode("even"));
          document.getElementById("addRowBtn").addEventListener("click", () => {
            state.seats.push(String(state.seats.length + 1).padStart(2, "0"));
            renderTable();
          });
          document.getElementById("generateBtn").addEventListener("click", () => {
            const count = Math.max(state.seats.length, 20);
            state.seats = Array.from({ length: count }, (_, index) => String(index + 1).padStart(2, "0"));
            renderTable();
          });
          document.getElementById("clearBtn").addEventListener("click", () => {
            state.seats = [];
            renderTable();
          });
          seatRows.addEventListener("input", (event) => {
            if (!event.target.matches("input[data-index]")) return;
            state.seats[Number(event.target.dataset.index)] = event.target.value;
            renderPreview();
          });
          seatRows.addEventListener("click", (event) => {
            const button = event.target.closest("button[data-delete]");
            if (!button) return;
            state.seats.splice(Number(button.dataset.delete), 1);
            renderTable();
          });
        }

        bindEvents();
        renderTable();
      })();
    </script>
  </body>
</html>
